name = "xau-ai-supervisor"
main = "src/index.ts"
compatibility_date = "2026-11-24"
workers_dev = true

[vars]
MIN_SIGNAL_SCORE = "75"
MIN_RISK_REWARD = "1.5"
STOP_ATR_MULTIPLIER = "1.2"
MAX_DAILY_LOSS_PERCENT = "5"
RISK_TIMEZONE = "UTC"
HIGH_IMPACT_BLOCK_MINUTES = "15"
MACRO_MAX_AGE_MINUTES = "30"
RISK_MAX_AGE_MINUTES = "2"
ALERT_COOLDOWN_MINUTES = "15"
ENABLE_AI_REVIEW = "false"
AI_MODEL = "@cf/google/gemma-4-26b-a4b-it"

[[d1_databases]]
binding = "DB"
database_name = "xau-ai-supervisor"
database_id = "e12e9c25-597f-4f13-b065-123ee1f2041e"

[triggers]
crons = ["*/2 * * * *", "0 2 * * *"]

[observability]
enabled = true

[ai]
binding = "AI"
