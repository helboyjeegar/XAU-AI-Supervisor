name = "xau-ai-supervisor"
main = "src/index.ts"
compatibility_date = "2026-11-24"
workers_dev = true

[vars]
MIN_SIGNAL_SCORE = "75"
MIN_RISK_REWARD = "1.5"
STOP_ATR_MULTIPLIER = "1.2"
MAX_DAILY_LOSS_PERCENT = "5"
RISK_TIMEZONE = "UTC"
HIGH_IMPACT_BLOCK_MINUTES = "15"
MACRO_MAX_AGE_MINUTES = "30"
RISK_MAX_AGE_MINUTES = "2"
ALERT_COOLDOWN_MINUTES = "15"
ENABLE_AI_REVIEW = "false"
ENABLE_TRADINGAGENTS = "false"
TRADINGAGENTS_MIN_INTERVAL_MINUTES = "15"
TRADINGAGENTS_MAX_RUNS_PER_UTC_DAY = "8"
AI_MODEL = "@cf/google/gemma-4-26b-a4b-it"

[[d1_databases]]
binding = "DB"
database_name = "xau-ai-supervisor"
database_id = "e12e9c25-597f-4f13-b065-123ee1f2041e"

[triggers]
crons = ["*/2 * * * *", "0 2 * * *"]

[observability]
enabled = true

[ai]
binding = "AI"

[previews.vars]
MIN_SIGNAL_SCORE = "75"
MIN_RISK_REWARD = "1.5"
STOP_ATR_MULTIPLIER = "1.2"
MAX_DAILY_LOSS_PERCENT = "5"
RISK_TIMEZONE = "UTC"
HIGH_IMPACT_BLOCK_MINUTES = "15"
MACRO_MAX_AGE_MINUTES = "30"
RISK_MAX_AGE_MINUTES = "2"
ALERT_COOLDOWN_MINUTES = "15"
ENABLE_AI_REVIEW = "false"
ENABLE_TRADINGAGENTS = "false"
TRADINGAGENTS_MIN_INTERVAL_MINUTES = "15"
TRADINGAGENTS_MAX_RUNS_PER_UTC_DAY = "8"
AI_MODEL = "@cf/google/gemma-4-26b-a4b-it"

[[previews.d1_databases]]
binding = "DB"
database_name = "xau-ai-supervisor-preview"
database_id = "42bb032c-d3e0-4653-a932-b02bceca5c04"

[previews.ai]
binding = "AI"
